  <!-- CLOSING CTA BAND.
       The headline and copy come from seasonalNote in site.config.js, so the
       whole site changes offer with the season from one place. It used to be
       hardcoded to fall clean-ups, which went stale the moment winter
       started. -->
  <section class="cta-band">
    <div class="container">
      <div class="cta-band-card reveal">
        <span class="section-tag">Now Booking</span>
        <h2 class="section-title">{{seasonalNote.title}}</h2>
        <p class="cta-band-lede">{{seasonalNote.text}}</p>
        <p class="cta-band-reply">Tell me about your property and I will get back to you {{quoteReplyTime}}.</p>
        <a href="/contact" class="btn-primary">Request a Quote</a>
      </div>
    </div>
  </section>
